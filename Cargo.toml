[package]
name = "lmdeck"
version = "0.1.0"
edition = "2021"
rust-version = "1.85"
resolver = "3"
description = "One CLI to manage local AI model recipes: quant, engine and hardware configs from Hugging Face, GitHub and friends."
license = "MIT"
repository = "https://github.com/jvr0x/lmdeck"
readme = "README.md"
keywords = ["llm", "local-ai", "llama-cpp", "vllm", "exllamav3"]
categories = ["command-line-utilities"]
publish = false

[dependencies]
anyhow = "1"
clap = { version = "4.5", features = ["derive", "env"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
toml = "0.8"
ureq = { version = "2.10", features = ["json"] }
unicode-width = "0.2"
libc = "0.2"
shlex = "1.3"
ratatui = { version = "0.29", default-features = false, features = ["crossterm"] }
crossterm = "0.28"
tiny_http = "0.12"

[dev-dependencies]
assert_cmd = "2"
predicates = "3"
tempfile = "3"

[profile.release]
lto = "thin"
strip = true
