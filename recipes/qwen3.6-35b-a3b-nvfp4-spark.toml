# NVFP4 needs Blackwell (compute capability 10.0+; GB10 is 12.1).
schema = 1
display_name = "Qwen3.6 35B-A3B (NVFP4, vLLM)"
description = "NVIDIA's NVFP4 checkpoint of Qwen3.6 35B-A3B on vLLM in Docker, tuned for one DGX Spark."
tags = ["qwen3.6", "moe", "dgx-spark", "nvfp4", "tools"]

[model]
repo = "nvidia/Qwen3.6-35B-A3B-NVFP4"
size_gb = 23.5

[quant]
format = "nvfp4"
bits = 4.0

[engine]
name = "vllm"
port = 8000
ctx = 65536
image = "vllm/vllm-openai:cu130-nightly"
args = [
  "--gpu-memory-utilization=0.45",
  "--max-num-seqs=16",
  "--enable-auto-tool-choice",
  "--tool-call-parser", "qwen3_xml",
  "--reasoning-parser", "qwen3",
]

[hardware]
min_memory_gb = 40
accelerator = ["nvidia"]
os = ["linux"]
min_compute_capability = "10.0"
