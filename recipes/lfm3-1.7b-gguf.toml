# Requires llama.cpp b12088 or newer: the NVFP4 file needs the FP4 tensor-core
# path (older builds load it but compute wrong output). On Blackwell (DGX Spark)
# the feed-forward layers run on FP4 tensor cores; use LiquidAI/LFM3-1.7B-NVFP4
# safetensors with SGLang once its LFM3 support lands.
# Sampling is the model card's general preset (chat, tool use, agents, coding):
# temperature 0.1, top_k 50, repetition penalty 1.1.
# Math/STEM preset instead: --temp 1.0 --top-p 0.95 --top-k 20 (drop --min-p
# and --repeat-penalty); edit `args` for those workloads.
# --no-reasoning-preserve drops earlier turns' reasoning, the model card default.
schema = 1
display_name = "LFM3 1.7B (NVFP4 GGUF)"
description = "LiquidAI LFM3 1.7B on llama.cpp: NVFP4 feed-forward weights, 256K context, agentic/tool-trained, ~1.28 GB. Needs llama.cpp b12088 or newer; runs NVFP4 on Blackwell FP4 tensor cores."
tags = ["lfm3", "liquid", "agent", "tool-use", "nvfp4", "gguf", "blackwell", "small", "dgx-spark"]

[model]
repo = "LiquidAI/LFM3-1.7B-GGUF"
files = ["LFM3-1.7B-NVFP4.gguf"]
size_gb = 1.28

[quant]
format = "gguf"
bits = 4.0
label = "NVFP4"

[engine]
name = "llama.cpp"
ctx = 262144
args = [
  "--jinja",
  "--no-reasoning-preserve",
  "--temp", "0.1",
  "--top-k", "50",
  "--top-p", "1.0",
  "--min-p", "0.0",
  "--repeat-penalty", "1.1",
]

[hardware]
min_memory_gb = 8
