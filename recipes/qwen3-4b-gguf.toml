# Small, fast, runs anywhere llama.cpp does (Mac, Spark, plain x86 box).
display_name = "Qwen3 4B (GGUF Q4_K_M)"
description = "Qwen3 4B on llama.cpp. Tiny smoke-test model: ~2.5 GB, runs on CPU, Metal or CUDA."
tags = ["qwen3", "small", "chat"]

[model]
repo = "unsloth/Qwen3-4B-GGUF"
files = ["Qwen3-4B-Q4_K_M.gguf"]
size_gb = 2.5

[quant]
format = "gguf"
label = "Q4_K_M"

[engine]
name = "llama.cpp"
port = 8080
ctx = 32768
args = ["--n-gpu-layers", "999", "--jinja"]

[hardware]
min_memory_gb = 4
