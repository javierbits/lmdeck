# Wraps Mia's AI Lab repo as-is: its start.sh builds (or pulls) a patched TensorFold image, downloads the
# 62 GiB EXL3 checkpoint plus the DFlash2 draft, `docker run -d`s the server and exits once it answers.
# lmdeck applies no patches and builds nothing itself. Settings go in through env (PORT, HOST, CONTAINER_NAME
# below; CONTEXT, PARALLEL, DRAFTS, KV_DTYPE, ... can be added to [engine.env] or the checkout's .env).
display_name = "Ornith 1.5 122B (EXL3 4bpw, TensorFold, Mia's scripts)"
description = "Ornith-1.5-122B EXL3 + DFlash2 drafts on one DGX Spark, run by MiaAI-Lab's own start.sh / stop.sh."
tags = ["ornith", "qwen3.5-moe", "exl3", "tensorfold", "dflash", "dgx-spark", "wrapped"]

[source]
repo = "https://github.com/MiaAI-Lab/Ornith-1.5-122B-TensorFold"
# Pinned to the commit this recipe was written against; use "main" to follow the repo.
ref = "0c8fd6a0d1e2ece7557978a7d8c3d96d137eb075"

[quant]
format = "exl3"
bits = 4.049

[engine]
name = "custom"
command = ["./start.sh"]
stop = ["./stop.sh"]
detached = true
container = "ornith-122b-tf"
logs = ["docker", "logs", "-f", "ornith-122b-tf"]
port = 8888
# The first run builds the image and downloads ~64 GiB before the server can answer.
ready_timeout = 10800

[engine.env]
PORT = "{port}"
HOST = "{host}"
CONTAINER_NAME = "{container}"

[hardware]
min_memory_gb = 100
os = ["linux"]
arch = ["aarch64"]
accelerator = ["nvidia"]
